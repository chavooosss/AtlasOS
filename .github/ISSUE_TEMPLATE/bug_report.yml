name: Bug report
description: Report a reproducible AtlasOS issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: AtlasOS version
      placeholder: 0.6.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and environment
      description: Model, CPU/GPU, boot mode, resolution, and Live/installed state. Do not include serial numbers, MAC addresses, or private identifiers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and expected/actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Review attachments for personal, device, and network information before sharing.
