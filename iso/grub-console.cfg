insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search_fs_file

search --no-floppy --file --set=root /casper/vmlinuz
set default=0
set timeout=5
terminal_input console
terminal_output console
set gfxpayload=keep

# Atlas colors within the firmware's text console. No graphics modules, font,
# image, or GRUB theme is loaded; the graphical stack is implicated by the
# physical test, while its individual failing component is not yet isolated.
set color_normal=light-cyan/black
set color_highlight=white/blue
set menu_color_normal=light-cyan/black
set menu_color_highlight=white/blue

menuentry "ATLAS OS 0.6.3  |  Live oturumu baslat" {
    linux /casper/vmlinuz boot=live config boot=casper username=atlas hostname=atlasos locales=tr_TR.UTF-8 keyboard-layouts=tr keyboard-configuration/layoutcode=tr console-setup/layoutcode=tr timezone=Europe/Istanbul quiet splash vt.handoff=7
    initrd /casper/initrd.img
}

menuentry "Guvenli grafik  |  Ekran sorunlari icin" {
    linux /casper/vmlinuz boot=live config boot=casper username=atlas hostname=atlasos locales=tr_TR.UTF-8 keyboard-layouts=tr keyboard-configuration/layoutcode=tr console-setup/layoutcode=tr timezone=Europe/Istanbul quiet splash vt.handoff=7 nomodeset
    initrd /casper/initrd.img
}
